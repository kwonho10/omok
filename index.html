<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101216">
<title>오목 온라인</title>
<style>
  :root {
    --bg: #101216;
    --surface: #181b21;
    --surface-2: #20242c;
    --border: #2b303a;
    --text: #eceef2;
    --muted: #8a90a0;
    --accent: #d7b26a;
    --accent-ink: #1b1608;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: manipulation;
  }
  #app { width: 100%; max-width: 480px; padding: 14px 16px 24px; }

  .topbar { display: flex; justify-content: flex-end; gap: 6px; }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip.on { color: var(--accent); border-color: rgba(215, 178, 106, 0.45); }

  .screen { display: none; }
  .screen.active { display: block; }

  /* LOBBY */
  .logo { text-align: center; padding: 36px 0 28px; }
  .logo-stones { display: inline-flex; margin-bottom: 14px; }
  .logo-stones i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .logo-stones i:first-child { background: radial-gradient(circle at 35% 30%, #666, #050505); }
  .logo-stones i:last-child { background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf); margin-left: -6px; }
  .logo h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .logo p { color: var(--muted); font-size: 14px; margin-top: 8px; }

  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--muted); }

  input[type=text] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 16px;
    padding: 13px 16px;
    outline: none;
    font-family: inherit;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: #5b6170; }
  .name-input { margin-bottom: 12px; }
  .code-input { letter-spacing: 8px; text-align: center; text-transform: uppercase; font-weight: 700; }
  .code-input::placeholder { letter-spacing: 1px; font-weight: 400; font-size: 14px; }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid transparent;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s, background 0.2s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { background: var(--surface); }
  .btn-secondary { background: var(--surface-2); color: var(--text); }
  .divider { text-align: center; color: #4a4f5c; font-size: 12px; margin: 14px 0; }
  .gap { margin-top: 10px; }

  /* WAITING */
  .room-code-display { text-align: center; padding: 14px 0 6px; }
  .room-code-display p { color: var(--muted); font-size: 13px; }
  .room-code-display .code {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 10px;
    padding-left: 10px;
    color: var(--accent);
    margin: 10px 0 6px;
  }
  .copy-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .player-list { margin-top: 18px; }
  .player-item {
    display: flex; align-items: center;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .stone { width: 18px; height: 18px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
  .stone.black { background: radial-gradient(circle at 35% 30%, #666, #050505); }
  .stone.white { background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf); }
  .stone.empty { background: transparent; border: 2px dashed #444a58; }

  /* GAME */
  .game-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    margin: 6px 0 10px;
  }
  .player-badge {
    display: flex; align-items: center;
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    border: 1px solid var(--border);
    min-width: 0;
    transition: border-color 0.2s, background 0.2s;
  }
  .player-badge.active { border-color: var(--accent); background: #1d1a12; }
  .player-badge .stone { width: 16px; height: 16px; margin-right: 8px; }
  .player-badge .pname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-badge .you { font-size: 10px; color: var(--accent); margin-left: 6px; flex-shrink: 0; }

  .timer-box { text-align: center; min-width: 64px; }
  .turn-text { font-size: 11px; color: var(--muted); }
  .timer-num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .timer-num.urgent { color: var(--danger); }

  .timebar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
  .timebar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 0.1s linear; }
  .timebar i.urgent { background: var(--danger); }

  .board-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    background: #dcb36b;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

  .msg-bar { text-align: center; padding: 14px 8px; font-size: 14px; color: var(--muted); min-height: 48px; }
  .msg-bar.win { color: var(--accent); font-weight: 700; font-size: 16px; }

  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row .btn { flex: 1; }
  .row .btn.grow { flex: 2; }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  #confirm-modal { z-index: 110; }
  .modal {
    background: var(--surface);
    border-radius: 20px;
    padding: 30px 22px 22px;
    text-align: center;
    border: 1px solid var(--border);
    max-width: 320px;
    width: 90%;
  }
  .modal h2 { font-size: 26px; margin-bottom: 8px; }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 22px; line-height: 1.5; }
  .modal .btn { margin-top: 8px; }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 200;
    pointer-events: none;
    max-width: 92%;
    text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

<div class="topbar">
  <button class="chip" id="chip-bgm">♪ BGM</button>
  <button class="chip" id="chip-sfx">효과음</button>
</div>

<!-- LOBBY -->
<div id="lobby-screen" class="screen active">
  <div class="logo">
    <div class="logo-stones"><i></i><i></i></div>
    <h1>오목</h1>
    <p>친구와 함께 즐기는 온라인 오목</p>
  </div>

  <div class="card">
    <h2>내 이름</h2>
    <input type="text" id="input-name" class="name-input" placeholder="닉네임 입력" maxlength="10">
    <button class="btn btn-primary" id="btn-create">새 방 만들기</button>
    <div class="divider">또는</div>
    <input type="text" id="input-code" class="code-input" placeholder="방 코드 4자리" maxlength="4">
    <button class="btn btn-secondary gap" id="btn-join">방 참가하기</button>
  </div>
</div>

<!-- WAITING -->
<div id="waiting-screen" class="screen">
  <div class="logo" style="padding-bottom:18px">
    <div class="logo-stones"><i></i><i></i></div>
    <h1>오목</h1>
  </div>
  <div class="card">
    <div class="room-code-display">
      <p>방 코드를 친구에게 알려주세요</p>
      <div class="code" id="display-code">----</div>
      <button class="copy-btn" id="btn-copy-code">코드 복사</button>
    </div>
    <div class="player-list" id="player-list"></div>
    <div style="margin-top:16px;text-align:center;color:var(--muted);font-size:13px">
      <span class="status-dot"></span>친구가 접속하면 자동으로 시작됩니다
    </div>
  </div>
  <button class="btn btn-ghost" id="btn-leave-lobby">나가기</button>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="player-badge" id="badge-black">
      <div class="stone black"></div>
      <span class="pname" id="name-black">-</span>
      <span class="you" id="you-black" style="display:none">나</span>
    </div>
    <div class="timer-box">
      <div class="turn-text" id="turn-text">흑 차례</div>
      <div class="timer-num" id="timer-num">20</div>
    </div>
    <div class="player-badge" id="badge-white">
      <div class="stone white"></div>
      <span class="pname" id="name-white">-</span>
      <span class="you" id="you-white" style="display:none">나</span>
    </div>
  </div>
  <div class="timebar"><i id="timebar-fill"></i></div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <div class="msg-bar" id="msg-bar">상대방의 접속을 기다리는 중...</div>

  <div class="row" id="place-row" style="display:none">
    <button class="btn btn-primary grow" id="btn-place">여기에 놓기</button>
    <button class="btn btn-ghost" id="btn-cancel-place">취소</button>
  </div>
  <div class="row">
    <button class="btn btn-ghost" id="btn-restart">다시 플레이</button>
    <button class="btn btn-ghost" id="btn-leave">방 나가기</button>
  </div>
</div>

</div><!-- #app -->

<div class="modal-backdrop" id="result-modal">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-msg"></p>
    <button class="btn btn-primary" id="btn-play-again">다시 플레이</button>
    <button class="btn btn-ghost" id="btn-view-board">보드 보기</button>
    <button class="btn btn-ghost" id="btn-lobby">로비로</button>
  </div>
</div>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h2>다시 시작할까요?</h2>
    <p>상대방이 새 게임을 요청했습니다.<br>수락하면 지금 판은 끝나고 새로 시작합니다.</p>
    <button class="btn btn-primary" id="btn-confirm-yes">수락</button>
    <button class="btn btn-ghost" id="btn-confirm-no">거절</button>
  </div>
</div>

<div id="toast"></div>

<!-- PeerJS (브라우저끼리 직접 연결, 데이터베이스 불필요) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer || document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>

<script>
(() => {
'use strict';

// ── 상수 ──────────────────────────────────────────────────────
const BOARD = 15;
const N = BOARD * BOARD;
const PREFIX = 'omokgame-';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TURN_LIMIT = 20;     // 한 수당 제한 시간(초)
const MAX_TIMEOUTS = 3;    // 연속 시간 초과 몇 번이면 패배

const $ = id => document.getElementById(id);

// ══════════════════════════════════════════════════════════════
//  소리 (BGM + 효과음) — 전부 브라우저에서 직접 합성, 파일 불필요
// ══════════════════════════════════════════════════════════════
const Snd = (() => {
  let ctx = null, master = null, verbIn = null, bgmBus = null;
  let bgmTimer = null, nextBar = 0, barIdx = 0;
  let bgmOn = true, sfxOn = true;
  try {
    bgmOn = localStorage.getItem('omok_bgm') !== '0';
    sfxOn = localStorage.getItem('omok_sfx') !== '0';
  } catch (e) {}
  const save = () => {
    try {
      localStorage.setItem('omok_bgm', bgmOn ? '1' : '0');
      localStorage.setItem('omok_sfx', sfxOn ? '1' : '0');
    } catch (e) {}
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    // 잔향(리버브)
    const len = Math.floor(ctx.sampleRate * 2.4);
    const imp = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = imp.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const conv = ctx.createConvolver();
    conv.buffer = imp;
    verbIn = ctx.createGain();
    verbIn.gain.value = 0.45;
    verbIn.connect(conv);
    conv.connect(master);
    return true;
  }

  function unlock() {
    if (!init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (bgmOn && !bgmTimer) startBgm();
  }

  // 피아노 비슷한 부드러운 음
  function pluck(bus, midi, t, dur, vel) {
    const f = hz(midi);
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const g = ctx.createGain(), g2 = ctx.createGain(), lp = ctx.createBiquadFilter();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.value = f; o2.frequency.value = f * 2;
    g2.gain.value = 0.18;
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(bus);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }

  // 잔잔한 클래식 풍 BGM: 느린 아르페지오 + 천천히 흐르는 멜로디 (D장조, 8마디 x 2 변주 반복)
  const BEAT = 60 / 66;
  const CH = [
    [50, 54, 57, 62, 66], // D
    [45, 52, 57, 61, 64], // A
    [47, 54, 59, 62, 66], // Bm
    [42, 49, 54, 57, 61], // F#m
    [43, 50, 55, 59, 62], // G
    [50, 54, 57, 62, 66], // D
    [43, 50, 55, 59, 62], // G
    [45, 52, 57, 61, 64]  // A
  ];
  const MEL_A = [
    [[78, 2], [74, 1], [76, 1]],
    [[73, 2], [76, 2]],
    [[74, 2], [71, 1], [74, 1]],
    [[73, 2], [69, 1], [73, 1]],
    [[71, 1], [74, 1], [79, 2]],
    [[78, 2], [74, 2]],
    [[79, 1], [78, 1], [74, 2]],
    [[76, 1], [73, 1], [69, 2]]
  ];
  const MEL_B = [
    [[74, 1], [78, 1], [81, 2]],
    [[76, 2], [73, 1], [76, 1]],
    [[71, 1], [74, 1], [78, 2]],
    [[73, 2], [76, 1], [78, 1]],
    [[79, 2], [78, 1], [76, 1]],
    [[74, 2], [78, 1], [74, 1]],
    [[71, 2], [74, 1], [79, 1]],
    [[81, 1], [76, 1], [73, 2]]
  ];
  const ARP = [1, 2, 3, 2, 4, 3, 2, 1];

  function scheduleBar(i, t) {
    const bar = i % 8;
    const ch = CH[bar];
    const mel = (Math.floor(i / 8) % 2 === 0 ? MEL_A : MEL_B)[bar];
    pluck(bgmBus, ch[0], t, BEAT * 3.6, 0.16);
    for (let k = 0; k < 8; k++) pluck(bgmBus, ch[ARP[k]], t + k * BEAT / 2, BEAT * 1.6, 0.07);
    let tt = t;
    for (const [m, b] of mel) {
      pluck(bgmBus, m, tt, BEAT * b * 1.4, 0.10);
      tt += b * BEAT;
    }
  }

  function startBgm() {
    if (!ctx || bgmTimer) return;
    bgmBus = ctx.createGain();
    bgmBus.gain.value = 0;
    bgmBus.gain.setTargetAtTime(0.8, ctx.currentTime, 0.4);
    bgmBus.connect(master);
    bgmBus.connect(verbIn);
    nextBar = ctx.currentTime + 0.15;
    barIdx = 0;
    const pump = () => {
      while (nextBar < ctx.currentTime + 5) {
        scheduleBar(barIdx, nextBar);
        nextBar += 4 * BEAT;
        barIdx = (barIdx + 1) % 16;
      }
    };
    pump();
    bgmTimer = setInterval(pump, 500);
  }

  function stopBgm() {
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    if (bgmBus) {
      const b = bgmBus;
      bgmBus = null;
      try {
        b.gain.cancelScheduledValues(ctx.currentTime);
        b.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
      } catch (e) {}
      setTimeout(() => { try { b.disconnect(); } catch (e) {} }, 800);
    }
  }

  // 효과음
  function sfx(fn) {
    if (!sfxOn || !init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    fn(ctx.currentTime);
  }
  function tone(type, freq, t, dur, vel, glideTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  const api = {
    unlock,
    isBgm: () => bgmOn,
    isSfx: () => sfxOn,
    toggleBgm() {
      bgmOn = !bgmOn;
      save();
      if (bgmOn) { if (init()) { ctx.resume(); startBgm(); } }
      else stopBgm();
      return bgmOn;
    },
    toggleSfx() {
      sfxOn = !sfxOn;
      save();
      if (sfxOn) api.click();
      return sfxOn;
    },
    // 바둑돌 놓는 소리
    click() {
      sfx(t => {
        tone('sine', 220, t, 0.09, 0.5, 60);
        const len = Math.floor(ctx.sampleRate * 0.03);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = ctx.createBufferSource();
        s.buffer = buf;
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 1500;
        const g = ctx.createGain();
        g.gain.value = 0.3;
        s.connect(hp); hp.connect(g); g.connect(master);
        s.start(t);
      });
    },
    tick() { sfx(t => tone('sine', 880, t, 0.05, 0.12)); },
    warn() { sfx(t => tone('triangle', 200, t, 0.18, 0.25, 150)); },
    win() {
      sfx(t => { [72, 76, 79, 84].forEach((m, i) => tone('triangle', hz(m), t + i * 0.12, i === 3 ? 0.7 : 0.2, 0.25)); });
    },
    // 띠로리~
    lose() {
      sfx(t => {
        [76, 72, 69].forEach((m, i) => tone('square', hz(m), t + i * 0.14, 0.16, 0.14));
        tone('square', hz(64), t + 0.46, 0.9, 0.14, hz(58));
      });
    },
    draw() {
      sfx(t => { tone('triangle', hz(69), t, 0.3, 0.2); tone('triangle', hz(72), t + 0.18, 0.5, 0.2); });
    }
  };
  return api;
})();

function updateSoundChips() {
  $('chip-bgm').classList.toggle('on', Snd.isBgm());
  $('chip-sfx').classList.toggle('on', Snd.isSfx());
}
$('chip-bgm').addEventListener('click', () => { Snd.toggleBgm(); updateSoundChips(); });
$('chip-sfx').addEventListener('click', () => { Snd.toggleSfx(); updateSoundChips(); });
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => Snd.unlock(), { passive: true }));
updateSoundChips();

// ── 상태 ──────────────────────────────────────────────────────
// 방장(host)이 게임 상태를 관리하고, 방장이 흑돌입니다.
// 참가자(guest)는 백돌이며 방장에게 수를 보내고 상태를 받아 그립니다.
let myName = '';
let roomCode = '';
let myRole = null;        // 'black' | 'white'
let peer = null;
let conn = null;
let state = null;         // { black, white, board, turn, winner, reason, lastBy, timeouts, notice, seq }
let inRoom = false;
let busy = false;
let gameOver = false;
let resultShown = false;
let waitingMove = false;
let selectedIdx = -1;
let joinTimer = null;
let hostTimer = null;
let seqCounter = 0;
let lastSeq = null;
let lastStones = 0;
let turnStart = 0;
let lastTickSec = null;
let restartPending = false;

// ── UI 헬퍼 ───────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function toast(msg, ms = 2000) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
function showError(prefix, err) {
  console.error(prefix, err);
  const code = (err && (err.type || err.code || err.message)) || String(err);
  toast(prefix + ': ' + code, 6000);
}
function setBusy(b) {
  busy = b;
  $('btn-create').disabled = b;
  $('btn-join').disabled = b;
}
function hidePlaceButtons() { $('place-row').style.display = 'none'; }
function hideConfirm() { $('confirm-modal').classList.remove('open'); }
function showConfirm() { $('confirm-modal').classList.add('open'); }

// ── 유틸 ──────────────────────────────────────────────────────
function genCode() {
  let s = '';
  for (let i = 0; i < 4; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  return s;
}
function cleanName(n, fallback) {
  n = String(n || '').trim().slice(0, 10);
  return n || fallback;
}
function newState(blackName, whiteName) {
  return {
    black: { name: blackName },
    white: whiteName ? { name: whiteName } : null,
    board: Array(N).fill(0),
    turn: 'black',
    winner: null,
    reason: null,
    lastBy: { black: -1, white: -1 },
    timeouts: { black: 0, white: 0 },
    notice: null,
    seq: 0
  };
}
function countStones(board) {
  let c = 0;
  for (let i = 0; i < board.length; i++) if (board[i]) c++;
  return c;
}

// ── 승리 판정 / 쌍삼(3-3) 금지 ────────────────────────────────
function checkWin(board, idx) {
  const color = board[idx];
  const row = Math.floor(idx / BOARD), col = idx % BOARD;
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let d = 1; d < 5; d++) {
      const r = row + dr * d, c = col + dc * d;
      if (r < 0 || r >= BOARD || c < 0 || c >= BOARD || board[r * BOARD + c] !== color) break;
      count++;
    }
    for (let d = 1; d < 5; d++) {
      const r = row - dr * d, c = col - dc * d;
      if (r < 0 || r >= BOARD || c < 0 || c >= BOARD || board[r * BOARD + c] !== color) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

function inBoard(r, c) { return r >= 0 && r < BOARD && c >= 0 && c < BOARD; }
function cellAt(b, r, c) { return inBoard(r, c) ? b[r * BOARD + c] : -1; } // -1 = 벽

function runInfo(b, r, c, dr, dc, color) {
  let fwd = 0, back = 0;
  while (cellAt(b, r + dr * (fwd + 1), c + dc * (fwd + 1)) === color) fwd++;
  while (cellAt(b, r - dr * (back + 1), c - dc * (back + 1)) === color) back++;
  return { len: fwd + back + 1, fwd, back };
}

// (r,c)를 포함한 연속 4개가 양쪽 모두 비어 있고, 어느 쪽을 채워도 정확히 5가 되는 "열린 4"인지
function isOpenFour(b, r, c, dr, dc, color) {
  const info = runInfo(b, r, c, dr, dc, color);
  if (info.len !== 4) return false;
  const r1 = r + dr * (info.fwd + 1), c1 = c + dc * (info.fwd + 1);
  const r2 = r - dr * (info.back + 1), c2 = c - dc * (info.back + 1);
  if (cellAt(b, r1, c1) !== 0 || cellAt(b, r2, c2) !== 0) return false;
  if (cellAt(b, r1 + dr, c1 + dc) === color) return false;
  if (cellAt(b, r2 - dr, c2 - dc) === color) return false;
  return true;
}

// idx에 둔 돌이 이 방향에서 "열린 3"을 만드는지 (한 수 더 두면 열린 4가 되는 자리가 있는지)
function hasOpenThree(b, idx, dr, dc, color) {
  const r0 = Math.floor(idx / BOARD), c0 = idx % BOARD;
  for (let d = -4; d <= 4; d++) {
    if (d === 0) continue;
    const r = r0 + dr * d, c = c0 + dc * d;
    if (!inBoard(r, c) || b[r * BOARD + c] !== 0) continue;
    b[r * BOARD + c] = color;
    let ok = false;
    const info = runInfo(b, r, c, dr, dc, color);
    if (info.len === 4) {
      const off = -d; // e 기준 idx의 위치
      if (off >= -info.back && off <= info.fwd) ok = isOpenFour(b, r, c, dr, dc, color);
    }
    b[r * BOARD + c] = 0;
    if (ok) return true;
  }
  return false;
}

// 흑이 idx에 두면 쌍삼(3-3)인가? (5목이 완성되면 허용)
function isForbidden(board, idx) {
  const b = board.slice();
  b[idx] = 1;
  if (checkWin(b, idx)) return false;
  let threes = 0;
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (const [dr, dc] of dirs) {
    if (hasOpenThree(b, idx, dr, dc, 1)) threes++;
  }
  return threes >= 2;
}

// ── 방 만들기 (방장) ──────────────────────────────────────────
$('btn-create').addEventListener('click', () => {
  if (busy) return;
  if (typeof Peer === 'undefined') {
    toast('PeerJS를 불러오지 못했습니다. 새로고침 해주세요.', 4000);
    return;
  }
  myName = cleanName($('input-name').value, '흑돌');
  setBusy(true);
  startConnectTimer();
  createRoom(0);
});

function startConnectTimer() {
  clearTimeout(joinTimer);
  joinTimer = setTimeout(() => {
    if (!inRoom) {
      toast('연결 시간이 초과되었습니다. 다시 시도해 주세요.', 4000);
      goLobby();
    }
  }, 15000);
}

function createRoom(attempt) {
  const code = genCode();
  const p = new Peer(PREFIX + code);
  peer = p;

  p.on('open', () => {
    if (peer !== p) return;
    clearTimeout(joinTimer);
    inRoom = true;
    roomCode = code;
    myRole = 'black';
    state = newState(myName, null);
    $('display-code').textContent = code;
    setBusy(false);
    show('waiting-screen');
    renderWaiting();
  });

  p.on('connection', c => {
    if (peer !== p) return;
    onGuestConnection(c);
  });

  p.on('disconnected', () => {
    if (peer === p && !p.destroyed) { try { p.reconnect(); } catch (e) {} }
  });

  p.on('error', err => {
    if (peer !== p) return;
    if (err.type === 'unavailable-id' && attempt < 5) {
      p.destroy();
      createRoom(attempt + 1);
      return;
    }
    if (inRoom) { toast('연결 문제: ' + (err.type || err.message), 3000); return; }
    showError('방 만들기 실패', err);
    goLobby();
  });
}

function onGuestConnection(c) {
  if (conn && conn.open) {
    c.on('open', () => {
      c.send({ type: 'full' });
      setTimeout(() => { try { c.close(); } catch (e) {} }, 500);
    });
    return;
  }
  conn = c;
  c.on('data', msg => { if (conn === c) hostReceive(msg); });
  c.on('close', () => guestLeft(c));
  c.on('error', () => guestLeft(c));
}

function guestLeft(c) {
  if (conn !== c || !state) return;
  conn = null;
  clearTimeout(hostTimer);
  hostTimer = null;
  state = newState(state.black.name, null);
  selectedIdx = -1;
  gameOver = false;
  resultShown = false;
  restartPending = false;
  lastSeq = null;
  lastStones = 0;
  hidePlaceButtons();
  hideConfirm();
  $('result-modal').classList.remove('open');
  show('waiting-screen');
  renderWaiting();
  toast('상대방이 나갔습니다');
}

function hostReceive(msg) {
  if (!msg || !state) return;
  if (msg.type === 'join') {
    state = newState(state.black.name, cleanName(msg.name, '백돌'));
    resultShown = false;
    lastStones = 0;
    commit();
  } else if (msg.type === 'move') {
    if (state.white) {
      const ok = applyMove(msg.idx, 'white');
      if (!ok) broadcast(); // 거부된 수: 현재 상태를 다시 보내 동기화
    }
  } else if (msg.type === 'restart') {
    if (state.white && state.winner) restartGame();
  } else if (msg.type === 'rs-req') {
    if (!state.white) return;
    if (state.winner) restartGame();
    else showConfirm();
  } else if (msg.type === 'rs-res') {
    onRestartReply(msg);
  }
}

function broadcast() {
  if (conn && conn.open) conn.send({ type: 'state', state });
}

// 방장: 상태가 바뀔 때마다 호출
function commit() {
  state.seq = ++seqCounter;
  broadcast();
  armHostTimer();
  handleState();
}

function armHostTimer() {
  clearTimeout(hostTimer);
  hostTimer = null;
  if (myRole !== 'black' || !state || !state.white || state.winner) return;
  hostTimer = setTimeout(onTurnTimeout, TURN_LIMIT * 1000);
}

function onTurnTimeout() {
  if (!state || !state.white || state.winner) return;
  const who = state.turn;
  const other = who === 'black' ? 'white' : 'black';
  state.timeouts[who]++;
  if (state.timeouts[who] >= MAX_TIMEOUTS) {
    state.winner = other;
    state.reason = 'timeout';
    state.notice = null;
  } else {
    state.turn = other;
    state.notice = `${state[who].name}님 시간 초과! 차례가 넘어갑니다`;
  }
  commit();
}

function applyMove(idx, role) {
  if (!state || state.winner || state.turn !== role) return false;
  if (!Number.isInteger(idx) || idx < 0 || idx >= N || state.board[idx] !== 0) return false;
  if (role === 'black' && isForbidden(state.board, idx)) return false;
  state.board[idx] = role === 'black' ? 1 : 2;
  state.lastBy[role] = idx;
  state.timeouts[role] = 0;
  state.notice = null;
  if (checkWin(state.board, idx)) {
    state.winner = role;
    state.reason = 'five';
  } else if (state.board.every(v => v !== 0)) {
    state.winner = 'draw';
    state.reason = 'draw';
  } else {
    state.turn = role === 'black' ? 'white' : 'black';
  }
  commit();
  return true;
}

function restartGame() {
  state = newState(state.black.name, state.white.name);
  resultShown = false;
  commit();
}

// ── 다시 플레이 (재시작 요청) ─────────────────────────────────
function requestRestart() {
  if (!state || !state.white) return;
  if (state.winner) {
    // 이미 끝난 판: 바로 새 판
    if (myRole === 'black') restartGame();
    else if (conn && conn.open) conn.send({ type: 'restart' });
    return;
  }
  if (restartPending) { toast('이미 요청을 보냈습니다'); return; }
  if (conn && conn.open) {
    conn.send({ type: 'rs-req' });
    restartPending = true;
    toast('상대방에게 다시 시작을 요청했습니다');
    setTimeout(() => { restartPending = false; }, 15000);
  }
}

function answerRestart(ok) {
  hideConfirm();
  if (!state) return;
  if (ok) {
    if (myRole === 'black') restartGame();
    else if (conn && conn.open) conn.send({ type: 'rs-res', ok: true });
  } else if (conn && conn.open) {
    conn.send({ type: 'rs-res', ok: false });
  }
}

function onRestartReply(msg) {
  restartPending = false;
  if (msg.ok) {
    if (myRole === 'black' && state && state.white) restartGame();
  } else {
    toast('상대방이 거절했습니다');
  }
}

$('btn-restart').addEventListener('click', requestRestart);
$('btn-play-again').addEventListener('click', () => {
  $('result-modal').classList.remove('open');
  requestRestart();
});
$('btn-view-board').addEventListener('click', () => $('result-modal').classList.remove('open'));
$('btn-lobby').addEventListener('click', goLobby);
$('btn-confirm-yes').addEventListener('click', () => answerRestart(true));
$('btn-confirm-no').addEventListener('click', () => answerRestart(false));

// ── 방 참가 (참가자) ──────────────────────────────────────────
$('btn-join').addEventListener('click', tryJoin);
$('input-code').addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });

function tryJoin() {
  if (busy) return;
  const code = $('input-code').value.trim().toUpperCase();
  if (code.length !== 4) { toast('방 코드는 4자리입니다'); return; }
  if (typeof Peer === 'undefined') {
    toast('PeerJS를 불러오지 못했습니다. 새로고침 해주세요.', 4000);
    return;
  }
  myName = cleanName($('input-name').value, '백돌');
  setBusy(true);
  startConnectTimer();
  joinRoom(code);
}

function joinRoom(code) {
  const p = new Peer();
  peer = p;

  p.on('open', () => {
    if (peer !== p) return;
    const c = p.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    conn = c;

    c.on('open', () => {
      if (conn !== c) return;
      clearTimeout(joinTimer);
      inRoom = true;
      roomCode = code;
      myRole = 'white';
      $('display-code').textContent = code;
      c.send({ type: 'join', name: myName });
    });

    c.on('data', msg => {
      if (conn !== c || !msg) return;
      if (msg.type === 'full') {
        toast('이미 가득 찬 방입니다');
        goLobby();
      } else if (msg.type === 'state') {
        if (!msg.state || !Array.isArray(msg.state.board)) return;
        state = msg.state;
        waitingMove = false;
        handleState();
      } else if (msg.type === 'rs-req') {
        showConfirm();
      } else if (msg.type === 'rs-res') {
        onRestartReply(msg);
      }
    });

    c.on('close', () => {
      if (conn !== c) return;
      toast(inRoom ? '방장이 나갔습니다' : '연결이 끊겼습니다');
      goLobby();
    });

    c.on('error', err => {
      if (conn !== c) return;
      showError('연결 오류', err);
      goLobby();
    });
  });

  p.on('error', err => {
    if (peer !== p) return;
    if (err.type === 'peer-unavailable') toast('존재하지 않는 방입니다');
    else showError('방 참가 실패', err);
    goLobby();
  });
}

// ── 화면 갱신 ─────────────────────────────────────────────────
function playerItem(cls, name, isMe) {
  const d = document.createElement('div');
  d.className = 'player-item';
  const s = document.createElement('div');
  s.className = 'stone ' + cls;
  d.appendChild(s);
  d.appendChild(document.createTextNode(name + (isMe ? ' (나)' : '')));
  return d;
}

function renderWaiting() {
  const list = $('player-list');
  list.innerHTML = '';
  const b = state && state.black;
  const w = state && state.white;
  list.appendChild(playerItem('black', b ? b.name : '대기 중...', myRole === 'black'));
  list.appendChild(playerItem(w ? 'white' : 'empty', w ? w.name : '대기 중...', myRole === 'white'));
}

function handleState() {
  if (!state) return;
  if (state.black && state.white) {
    initGameUI();
    if (!$('game-screen').classList.contains('active')) show('game-screen');
    if (state.seq !== lastSeq) {
      lastSeq = state.seq;
      turnStart = performance.now();
      lastTickSec = null;
      if (state.notice) { toast(state.notice, 2500); Snd.warn(); }
      const stones = countStones(state.board);
      if (stones > lastStones) Snd.click();
      if (stones === 0) { hideConfirm(); restartPending = false; }
      lastStones = stones;
    }
    renderGame();
  } else {
    renderWaiting();
  }
}

function initGameUI() {
  $('name-black').textContent = state.black.name;
  $('name-white').textContent = state.white.name;
  $('you-black').style.display = myRole === 'black' ? 'inline' : 'none';
  $('you-white').style.display = myRole === 'white' ? 'inline' : 'none';
}

// ── 보드 그리기 ───────────────────────────────────────────────
const canvas = $('board');
const ctx = canvas.getContext('2d');
let cssSize = 0;
let cellSize = 0;
let boardPad = 0;

function setupCanvas() {
  const size = canvas.parentElement.offsetWidth;
  const dpr = window.devicePixelRatio || 1;
  cssSize = size;
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cellSize = size / (BOARD + 1);
  boardPad = cellSize;
}

function drawBoard(boardArr, opts) {
  setupCanvas();
  const s = cssSize;
  ctx.clearRect(0, 0, s, s);

  const bg = ctx.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, '#e6c27f');
  bg.addColorStop(1, '#d3a85f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, s, s);

  // 격자
  ctx.strokeStyle = '#6b4e1d';
  ctx.lineWidth = 1;
  for (let i = 0; i < BOARD; i++) {
    const p = boardPad + i * cellSize;
    ctx.beginPath(); ctx.moveTo(p, boardPad); ctx.lineTo(p, boardPad + (BOARD - 1) * cellSize); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(boardPad, p); ctx.lineTo(boardPad + (BOARD - 1) * cellSize, p); ctx.stroke();
  }
  ctx.lineWidth = 1.8;
  ctx.strokeRect(boardPad, boardPad, (BOARD - 1) * cellSize, (BOARD - 1) * cellSize);

  // 화점
  ctx.fillStyle = '#6b4e1d';
  for (const r of [3, 7, 11]) for (const c of [3, 7, 11]) {
    ctx.beginPath();
    ctx.arc(boardPad + c * cellSize, boardPad + r * cellSize, cellSize * 0.09, 0, Math.PI * 2);
    ctx.fill();
  }

  const R = cellSize * 0.44;
  const pos = i => [boardPad + (i % BOARD) * cellSize, boardPad + Math.floor(i / BOARD) * cellSize];

  // 돌
  for (let i = 0; i < N; i++) {
    const v = boardArr[i];
    if (!v) continue;
    const [cx, cy] = pos(i);
    const grad = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
    if (v === 1) { grad.addColorStop(0, '#5a5a5a'); grad.addColorStop(1, '#050505'); }
    else { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#cfcfcf'); }
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = R * 0.18;
    ctx.shadowOffsetY = R * 0.08;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  // 내가 마지막으로 둔 돌: 작은 점
  if (opts.mine >= 0 && boardArr[opts.mine]) {
    const [cx, cy] = pos(opts.mine);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.14, 0, Math.PI * 2);
    ctx.fillStyle = boardArr[opts.mine] === 1 ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.45)';
    ctx.fill();
  }

  // 상대가 마지막으로 둔 돌: 빨간 링 + 점
  if (opts.opp >= 0 && boardArr[opts.opp]) {
    const [cx, cy] = pos(opts.opp);
    ctx.strokeStyle = '#ff4d4f';
    ctx.fillStyle = '#ff4d4f';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.66, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  // 금지 자리(3-3) 표시
  if (opts.forbidden && opts.forbidden.length) {
    ctx.strokeStyle = 'rgba(229,72,77,0.85)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    const k = cellSize * 0.18;
    for (const i of opts.forbidden) {
      const [cx, cy] = pos(i);
      ctx.beginPath();
      ctx.moveTo(cx - k, cy - k); ctx.lineTo(cx + k, cy + k);
      ctx.moveTo(cx + k, cy - k); ctx.lineTo(cx - k, cy + k);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  // 선택한 자리 미리보기
  if (opts.selected >= 0) {
    const [cx, cy] = pos(opts.selected);
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = myRole === 'black' ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.6)';
    ctx.fill();
    ctx.strokeStyle = myRole === 'black' ? '#333' : '#aaa';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function redraw() {
  if (!state) return;
  const opp = myRole === 'black' ? 'white' : 'black';
  const lastBy = state.lastBy || {};
  const forbidden = [];
  if (myRole === 'black' && state.turn === 'black' && !state.winner && state.white) {
    for (let i = 0; i < N; i++) {
      if (state.board[i] === 0 && isForbidden(state.board, i)) forbidden.push(i);
    }
  }
  drawBoard(state.board, {
    opp: lastBy[opp] ?? -1,
    mine: lastBy[myRole] ?? -1,
    forbidden,
    selected: selectedIdx
  });
}

function renderGame() {
  const data = state;
  const finished = !!data.winner;
  const myTurn = data.turn === myRole && !finished;

  if (!myTurn) { selectedIdx = -1; hidePlaceButtons(); }
  redraw();
  gameOver = finished;

  $('badge-black').classList.toggle('active', data.turn === 'black' && !finished);
  $('badge-white').classList.toggle('active', data.turn === 'white' && !finished);
  $('turn-text').textContent = finished ? '종료' : (data.turn === 'black' ? '흑 차례' : '백 차례');

  const msg = $('msg-bar');
  if (finished) {
    if (data.winner === 'draw') msg.textContent = '무승부입니다';
    else if (data.reason === 'timeout') msg.textContent = `${data[data.winner].name} 승리 (상대 시간 초과)`;
    else msg.textContent = `${data[data.winner].name} 승리!`;
    msg.className = 'msg-bar win';
    if (!resultShown) {
      resultShown = true;
      showResultModal();
    }
  } else {
    resultShown = false;
    $('result-modal').classList.remove('open');
    if (myTurn) {
      msg.textContent = selectedIdx >= 0 ? '이 자리에 놓을까요?' : '내 차례입니다. 돌을 놓으세요';
    } else {
      const opp = data.turn === 'black' ? data.black.name : data.white.name;
      msg.textContent = `${opp}님이 생각 중...`;
    }
    msg.className = 'msg-bar';
  }
}

// ── 돌 선택 ───────────────────────────────────────────────────
function setSelected(idx) {
  selectedIdx = idx;
  redraw();
  $('place-row').style.display = idx >= 0 ? 'flex' : 'none';
}

canvas.addEventListener('click', handleTap);
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  handleTap({ clientX: t.clientX, clientY: t.clientY });
}, { passive: false });

function handleTap(e) {
  if (!state || !state.white || gameOver || waitingMove) return;
  if (state.turn !== myRole) { toast('상대방 차례입니다'); return; }

  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (cssSize / rect.width);
  const py = (e.clientY - rect.top) * (cssSize / rect.height);

  const col = Math.round((px - boardPad) / cellSize);
  const row = Math.round((py - boardPad) / cellSize);
  if (col < 0 || col >= BOARD || row < 0 || row >= BOARD) return;

  const idx = row * BOARD + col;
  if (state.board[idx] !== 0) { toast('이미 돌이 있습니다'); return; }
  if (myRole === 'black' && isForbidden(state.board, idx)) {
    toast('쌍삼(3-3)은 흑이 둘 수 없는 자리입니다');
    Snd.warn();
    return;
  }

  setSelected(idx);
  $('msg-bar').textContent = '이 자리에 놓을까요?';
}

$('btn-place').addEventListener('click', () => {
  if (selectedIdx < 0 || !state) return;
  const idx = selectedIdx;
  selectedIdx = -1;
  hidePlaceButtons();
  if (myRole === 'black') {
    applyMove(idx, 'black');
  } else if (conn && conn.open) {
    waitingMove = true;
    conn.send({ type: 'move', idx });
  }
});

$('btn-cancel-place').addEventListener('click', () => {
  if (!state) return;
  selectedIdx = -1;
  hidePlaceButtons();
  renderGame();
});

// ── 결과 모달 ─────────────────────────────────────────────────
function showResultModal() {
  const w = state.winner;
  if (w === 'draw') {
    $('modal-title').textContent = '무승부';
    $('modal-msg').textContent = '승부가 나지 않았습니다.';
    Snd.draw();
  } else {
    const iWon = w === myRole;
    const loser = w === 'black' ? 'white' : 'black';
    $('modal-title').textContent = iWon ? '승리!' : '패배';
    $('modal-msg').textContent = state.reason === 'timeout'
      ? `${state[loser].name}님이 연속 ${MAX_TIMEOUTS}회 시간 초과로 패배했습니다.`
      : `${state[w].name}님이 이겼습니다.`;
    if (iWon) Snd.win(); else Snd.lose();
  }
  $('result-modal').classList.add('open');
}

// ── 타이머 표시 ───────────────────────────────────────────────
function updateTimerUI() {
  const num = $('timer-num'), fill = $('timebar-fill');
  const active = state && state.white && !state.winner && $('game-screen').classList.contains('active');
  if (!active) {
    num.textContent = state && state.winner ? '-' : TURN_LIMIT;
    fill.style.width = '0%';
    num.classList.remove('urgent');
    fill.classList.remove('urgent');
    return;
  }
  const left = Math.max(0, TURN_LIMIT - (performance.now() - turnStart) / 1000);
  num.textContent = Math.ceil(left);
  fill.style.width = (left / TURN_LIMIT * 100) + '%';
  const urgent = left <= 5;
  num.classList.toggle('urgent', urgent);
  fill.classList.toggle('urgent', urgent);
  if (urgent && state.turn === myRole) {
    const sec = Math.ceil(left);
    if (sec !== lastTickSec && sec > 0) { lastTickSec = sec; Snd.tick(); }
  }
}
setInterval(updateTimerUI, 100);

// ── 나가기 ────────────────────────────────────────────────────
$('btn-leave').addEventListener('click', goLobby);
$('btn-leave-lobby').addEventListener('click', goLobby);

function goLobby() {
  clearTimeout(joinTimer);
  clearTimeout(hostTimer);
  hostTimer = null;
  const c = conn, p = peer;
  conn = null;
  peer = null;
  try { c && c.close(); } catch (e) {}
  try { p && p.destroy(); } catch (e) {}
  state = null;
  myRole = null;
  roomCode = '';
  inRoom = false;
  gameOver = false;
  resultShown = false;
  waitingMove = false;
  restartPending = false;
  selectedIdx = -1;
  lastSeq = null;
  lastStones = 0;
  setBusy(false);
  hidePlaceButtons();
  hideConfirm();
  $('result-modal').classList.remove('open');
  show('lobby-screen');
}

// ── 코드 복사 ─────────────────────────────────────────────────
$('btn-copy-code').addEventListener('click', () => {
  navigator.clipboard.writeText(roomCode).then(() => toast('코드 복사됨')).catch(() => {
    toast(roomCode);
  });
});

// ── 창 크기 변화 / 페이지 닫기 ────────────────────────────────
window.addEventListener('resize', () => {
  if (state && $('game-screen').classList.contains('active')) renderGame();
});
window.addEventListener('beforeunload', () => {
  try { peer && peer.destroy(); } catch (e) {}
});
})();
</script>
</body>
</html>
