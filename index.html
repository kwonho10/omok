<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오목 온라인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #app { width: 100%; max-width: 480px; padding: 16px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* LOBBY */
  .logo {
    text-align: center;
    padding: 40px 0 32px;
  }
  .logo h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e94560, #0f3460);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo p { color: #888; font-size: 14px; margin-top: 6px; }

  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #0f3460;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #ccc; }

  input[type=text] {
    width: 100%;
    background: #0f3460;
    border: 1px solid #1a4a8a;
    border-radius: 10px;
    color: #fff;
    font-size: 18px;
    padding: 12px 16px;
    letter-spacing: 6px;
    text-align: center;
    text-transform: uppercase;
    outline: none;
  }
  input[type=text]:focus { border-color: #e94560; }
  input[type=text]::placeholder { letter-spacing: 2px; color: #555; font-size: 14px; }

  .name-input {
    letter-spacing: 0 !important;
    text-align: left !important;
    font-size: 15px !important;
    margin-bottom: 12px;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-secondary { background: #0f3460; color: #ccc; margin-top: 10px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .divider { text-align: center; color: #444; font-size: 13px; margin: 8px 0; }

  /* WAITING */
  .room-code-display {
    text-align: center;
    padding: 20px;
  }
  .room-code-display .code {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 10px;
    color: #e94560;
    margin: 10px 0;
  }
  .room-code-display p { color: #888; font-size: 13px; }

  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #e94560;
    margin-right: 8px;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .player-list { margin-top: 16px; }
  .player-item {
    display: flex; align-items: center;
    padding: 12px;
    background: #0f3460;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .stone {
    width: 20px; height: 20px;
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .stone.black { background: #111; border: 2px solid #555; }
  .stone.white { background: #fff; border: 2px solid #ccc; }
  .stone.empty { background: #1a4a8a; border: 2px dashed #555; }

  /* GAME */
  #game-screen { padding-bottom: 20px; }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    margin-bottom: 8px;
  }
  .player-badge {
    display: flex; align-items: center;
    background: #16213e;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    border: 1px solid #0f3460;
    flex: 1;
  }
  .player-badge.active { border-color: #e94560; background: #1e0a15; }
  .player-badge:first-child { margin-right: 6px; }
  .player-badge:last-child { margin-left: 6px; }
  .player-badge .stone { width: 16px; height: 16px; margin-right: 8px; }
  .player-badge .pname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .player-badge .you { font-size: 10px; color: #e94560; margin-left: 4px; }

  .turn-label {
    font-size: 11px; color: #888; text-align: center;
    min-width: 60px;
  }
  .turn-label span { display: block; font-size: 13px; font-weight: 600; color: #e94560; }

  .board-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    background: #C8A96E;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }

  .msg-bar {
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #aaa;
    min-height: 36px;
  }
  .msg-bar.win { color: #e94560; font-weight: 700; font-size: 16px; }

  #btn-leave {
    background: transparent;
    border: 1px solid #333;
    color: #666;
    font-size: 13px;
    padding: 10px;
    margin-top: 8px;
  }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #16213e;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    border: 1px solid #0f3460;
    max-width: 320px;
    width: 90%;
  }
  .modal h2 { font-size: 28px; margin-bottom: 8px; }
  .modal p { color: #888; font-size: 14px; margin-bottom: 24px; }

  .copy-btn {
    background: #0f3460;
    border: none;
    color: #aaa;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 8px;
    display: inline-block;
  }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #e94560;
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 200;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

<!-- LOBBY -->
<div id="lobby-screen" class="screen active">
  <div class="logo">
    <h1>⚫ 오목</h1>
    <p>친구와 함께 즐기는 온라인 오목</p>
  </div>

  <div class="card">
    <h2>내 이름</h2>
    <input type="text" id="input-name" class="name-input" placeholder="닉네임 입력" maxlength="10">
    <button class="btn btn-primary" id="btn-create">새 방 만들기</button>
    <div class="divider">또는</div>
    <input type="text" id="input-code" placeholder="방 코드 입력 (4자리)" maxlength="4">
    <button class="btn btn-secondary" id="btn-join" style="margin-top:10px">방 참가하기</button>
  </div>
</div>

<!-- WAITING -->
<div id="waiting-screen" class="screen">
  <div class="logo">
    <h1>⚫ 오목</h1>
  </div>
  <div class="card">
    <div class="room-code-display">
      <p style="color:#888;font-size:13px">방 코드를 친구에게 알려주세요</p>
      <div class="code" id="display-code">----</div>
      <button class="copy-btn" id="btn-copy-code">📋 코드 복사</button>
    </div>
    <div class="player-list" id="player-list"></div>
    <div style="margin-top:16px;text-align:center;color:#888;font-size:13px">
      <span class="status-dot"></span>친구가 접속하면 자동으로 시작됩니다
    </div>
  </div>
  <button class="btn" id="btn-leave-lobby" style="background:transparent;border:1px solid #333;color:#666;font-size:13px">나가기</button>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="player-badge" id="badge-black">
      <div class="stone black"></div>
      <span class="pname" id="name-black">-</span>
      <span class="you" id="you-black" style="display:none">나</span>
    </div>
    <div class="turn-label">
      <span id="turn-text">흑 차례</span>
      차례
    </div>
    <div class="player-badge" id="badge-white">
      <div class="stone white"></div>
      <span class="pname" id="name-white">-</span>
      <span class="you" id="you-white" style="display:none">나</span>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <div class="msg-bar" id="msg-bar">상대방의 접속을 기다리는 중...</div>
  <button class="btn btn-primary" id="btn-place" style="display:none;margin-bottom:8px">여기에 놓기 ✓</button>
  <button class="btn" id="btn-cancel-place" style="display:none;background:transparent;border:1px solid #333;color:#666;font-size:13px;margin-bottom:8px">선택 취소</button>
  <button class="btn" id="btn-leave">방 나가기</button>
</div>

</div><!-- #app -->

<div class="modal-backdrop" id="result-modal">
  <div class="modal">
    <h2 id="modal-title">🎉</h2>
    <p id="modal-msg"></p>
    <button class="btn btn-primary" id="btn-play-again">한판 더!</button>
    <button class="btn btn-secondary" id="btn-lobby">로비로</button>
  </div>
</div>

<div id="toast"></div>

<!-- PeerJS (브라우저끼리 직접 연결, 데이터베이스 불필요) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer || document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>

<script>
(() => {
'use strict';

// ── 상수 ──────────────────────────────────────────────────────
const BOARD = 15;
const N = BOARD * BOARD;
const PREFIX = 'omokgame-';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

// ── 상태 ──────────────────────────────────────────────────────
// 방장(host)이 게임 상태를 관리하고, 방장이 흑돌입니다.
// 참가자(guest)는 백돌이며 방장에게 수를 보내고 상태를 받아 그립니다.
let myName = '';
let roomCode = '';
let myRole = null;        // 'black' | 'white'
let peer = null;
let conn = null;          // 상대방과의 연결
let state = null;         // { black, white, board, turn, winner, lastMove }
let inRoom = false;
let busy = false;
let gameOver = false;
let resultShown = false;
let waitingMove = false;
let selectedIdx = -1;
let joinTimer = null;

const $ = id => document.getElementById(id);

// ── UI 헬퍼 ───────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function toast(msg, ms = 2000) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
function showError(prefix, err) {
  console.error(prefix, err);
  const code = (err && (err.type || err.code || err.message)) || String(err);
  toast(prefix + ': ' + code, 6000);
}
function setBusy(b) {
  busy = b;
  $('btn-create').disabled = b;
  $('btn-join').disabled = b;
}
function hidePlaceButtons() {
  $('btn-place').style.display = 'none';
  $('btn-cancel-place').style.display = 'none';
}

// ── 유틸 ──────────────────────────────────────────────────────
function genCode() {
  let s = '';
  for (let i = 0; i < 4; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  return s;
}
function cleanName(n, fallback) {
  n = String(n || '').trim().slice(0, 10);
  return n || fallback;
}
function newState(blackName, whiteName) {
  return {
    black: { name: blackName },
    white: whiteName ? { name: whiteName } : null,
    board: Array(N).fill(0),
    turn: 'black',
    winner: null,
    lastMove: -1
  };
}

// ── 방 만들기 (방장) ──────────────────────────────────────────
$('btn-create').addEventListener('click', () => {
  if (busy) return;
  if (typeof Peer === 'undefined') {
    toast('PeerJS를 불러오지 못했습니다. 새로고침 해주세요.', 4000);
    return;
  }
  myName = cleanName($('input-name').value, '흑돌');
  setBusy(true);
  startConnectTimer();
  createRoom(0);
});

function startConnectTimer() {
  clearTimeout(joinTimer);
  joinTimer = setTimeout(() => {
    if (!inRoom) {
      toast('연결 시간이 초과되었습니다. 다시 시도해 주세요.', 4000);
      goLobby();
    }
  }, 15000);
}

function createRoom(attempt) {
  const code = genCode();
  const p = new Peer(PREFIX + code);
  peer = p;

  p.on('open', () => {
    if (peer !== p) return;
    clearTimeout(joinTimer);
    inRoom = true;
    roomCode = code;
    myRole = 'black';
    state = newState(myName, null);
    $('display-code').textContent = code;
    setBusy(false);
    show('waiting-screen');
    renderWaiting();
  });

  p.on('connection', c => {
    if (peer !== p) return;
    onGuestConnection(c);
  });

  p.on('disconnected', () => {
    // 중계 서버와 끊겨도 이미 연결된 상대와는 계속 플레이 가능
    if (peer === p && !p.destroyed) { try { p.reconnect(); } catch (e) {} }
  });

  p.on('error', err => {
    if (peer !== p) return;
    if (err.type === 'unavailable-id' && attempt < 5) {
      p.destroy();
      createRoom(attempt + 1);
      return;
    }
    if (inRoom) { toast('연결 문제: ' + (err.type || err.message), 3000); return; }
    showError('방 만들기 실패', err);
    goLobby();
  });
}

function onGuestConnection(c) {
  if (conn && conn.open) {
    c.on('open', () => {
      c.send({ type: 'full' });
      setTimeout(() => { try { c.close(); } catch (e) {} }, 500);
    });
    return;
  }
  conn = c;
  c.on('data', msg => { if (conn === c) hostReceive(msg); });
  c.on('close', () => guestLeft(c));
  c.on('error', () => guestLeft(c));
}

function guestLeft(c) {
  if (conn !== c || !state) return;
  conn = null;
  state = newState(state.black.name, null);
  selectedIdx = -1;
  gameOver = false;
  resultShown = false;
  hidePlaceButtons();
  $('result-modal').classList.remove('open');
  show('waiting-screen');
  renderWaiting();
  toast('상대방이 나갔습니다');
}

function hostReceive(msg) {
  if (!msg || !state) return;
  if (msg.type === 'join') {
    state = newState(state.black.name, cleanName(msg.name, '백돌'));
    resultShown = false;
    broadcast();
    handleState();
  } else if (msg.type === 'move') {
    if (state.white) applyMove(msg.idx, 'white');
  } else if (msg.type === 'restart') {
    if (state.white && state.winner) restartGame();
  }
}

function broadcast() {
  if (conn && conn.open) conn.send({ type: 'state', state });
}

function applyMove(idx, role) {
  if (!state || state.winner || state.turn !== role) return;
  if (!Number.isInteger(idx) || idx < 0 || idx >= N || state.board[idx] !== 0) return;
  state.board[idx] = role === 'black' ? 1 : 2;
  state.lastMove = idx;
  if (checkWin(state.board, idx)) state.winner = role;
  else if (state.board.every(v => v !== 0)) state.winner = 'draw';
  else state.turn = role === 'black' ? 'white' : 'black';
  broadcast();
  handleState();
}

function restartGame() {
  state = newState(state.black.name, state.white.name);
  resultShown = false;
  broadcast();
  handleState();
}

// ── 방 참가 (참가자) ──────────────────────────────────────────
$('btn-join').addEventListener('click', () => {
  if (busy) return;
  const code = $('input-code').value.trim().toUpperCase();
  if (code.length !== 4) { toast('방 코드는 4자리입니다'); return; }
  if (typeof Peer === 'undefined') {
    toast('PeerJS를 불러오지 못했습니다. 새로고침 해주세요.', 4000);
    return;
  }
  myName = cleanName($('input-name').value, '백돌');
  setBusy(true);
  startConnectTimer();
  joinRoom(code);
});

function joinRoom(code) {
  const p = new Peer();
  peer = p;

  p.on('open', () => {
    if (peer !== p) return;
    const c = p.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    conn = c;

    c.on('open', () => {
      if (conn !== c) return;
      clearTimeout(joinTimer);
      inRoom = true;
      roomCode = code;
      myRole = 'white';
      $('display-code').textContent = code;
      c.send({ type: 'join', name: myName });
    });

    c.on('data', msg => {
      if (conn !== c || !msg) return;
      if (msg.type === 'full') {
        toast('이미 가득 찬 방입니다');
        goLobby();
      } else if (msg.type === 'state') {
        if (!msg.state || !Array.isArray(msg.state.board)) return;
        state = msg.state;
        waitingMove = false;
        handleState();
      }
    });

    c.on('close', () => {
      if (conn !== c) return;
      toast(inRoom ? '방장이 나갔습니다' : '연결이 끊겼습니다');
      goLobby();
    });

    c.on('error', err => {
      if (conn !== c) return;
      showError('연결 오류', err);
      goLobby();
    });
  });

  p.on('error', err => {
    if (peer !== p) return;
    if (err.type === 'peer-unavailable') toast('존재하지 않는 방입니다');
    else showError('방 참가 실패', err);
    goLobby();
  });
}

// ── 화면 갱신 ─────────────────────────────────────────────────
function playerItem(cls, name, isMe) {
  const d = document.createElement('div');
  d.className = 'player-item';
  const s = document.createElement('div');
  s.className = 'stone ' + cls;
  d.appendChild(s);
  d.appendChild(document.createTextNode(name + (isMe ? ' (나)' : '')));
  return d;
}

function renderWaiting() {
  const list = $('player-list');
  list.innerHTML = '';
  const b = state && state.black;
  const w = state && state.white;
  list.appendChild(playerItem('black', b ? b.name : '대기 중...', myRole === 'black'));
  list.appendChild(playerItem(w ? 'white' : 'empty', w ? w.name : '대기 중...', myRole === 'white'));
}

function handleState() {
  if (!state) return;
  if (state.black && state.white) {
    initGameUI();
    if (!$('game-screen').classList.contains('active')) show('game-screen');
    renderGame();
  } else {
    renderWaiting();
  }
}

function initGameUI() {
  $('name-black').textContent = state.black.name;
  $('name-white').textContent = state.white.name;
  $('you-black').style.display = myRole === 'black' ? 'inline' : 'none';
  $('you-white').style.display = myRole === 'white' ? 'inline' : 'none';
}

// ── 보드 그리기 ───────────────────────────────────────────────
const canvas = $('board');
const ctx = canvas.getContext('2d');
let cellSize = 0;
let boardPad = 0;

function setupCanvas() {
  const size = canvas.parentElement.offsetWidth;
  canvas.width = size;
  canvas.height = size;
  cellSize = size / (BOARD + 1);
  boardPad = cellSize;
}

function drawBoard(boardArr, lastMove) {
  setupCanvas();
  const s = canvas.width;
  ctx.clearRect(0, 0, s, s);

  ctx.fillStyle = '#C8A96E';
  ctx.fillRect(0, 0, s, s);

  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < BOARD; i++) {
    const x = boardPad + i * cellSize;
    ctx.beginPath(); ctx.moveTo(x, boardPad); ctx.lineTo(x, boardPad + (BOARD - 1) * cellSize); ctx.stroke();
    const y = boardPad + i * cellSize;
    ctx.beginPath(); ctx.moveTo(boardPad, y); ctx.lineTo(boardPad + (BOARD - 1) * cellSize, y); ctx.stroke();
  }

  const dots = [3, 7, 11];
  ctx.fillStyle = '#8B6914';
  for (const r of dots) for (const c of dots) {
    ctx.beginPath();
    ctx.arc(boardPad + c * cellSize, boardPad + r * cellSize, cellSize * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < N; i++) {
    if (!boardArr[i]) continue;
    const row = Math.floor(i / BOARD), col = i % BOARD;
    const cx = boardPad + col * cellSize;
    const cy = boardPad + row * cellSize;
    const r = cellSize * 0.44;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    if (boardArr[i] === 1) {
      ctx.fillStyle = '#111';
      ctx.fill();
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.fillStyle = '#f5f5f5';
      ctx.fill();
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (lastMove === i) {
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = boardArr[i] === 1 ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.4)';
      ctx.fill();
    }
  }
}

function drawSelection(idx) {
  const row = Math.floor(idx / BOARD), col = idx % BOARD;
  const cx = boardPad + col * cellSize;
  const cy = boardPad + row * cellSize;
  const r = cellSize * 0.44;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = myRole === 'black' ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  ctx.fill();
  ctx.strokeStyle = myRole === 'black' ? '#555' : '#bbb';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function renderGame() {
  const data = state;
  const finished = !!data.winner;

  if (data.turn !== myRole || finished) {
    selectedIdx = -1;
    hidePlaceButtons();
  }
  drawBoard(data.board, data.lastMove ?? -1);
  if (selectedIdx >= 0) drawSelection(selectedIdx);
  gameOver = finished;

  const myTurn = data.turn === myRole && !finished;
  $('badge-black').classList.toggle('active', data.turn === 'black' && !finished);
  $('badge-white').classList.toggle('active', data.turn === 'white' && !finished);
  $('turn-text').textContent = data.turn === 'black' ? '⚫ 흑' : '⚪ 백';

  const msg = $('msg-bar');
  if (finished) {
    if (data.winner === 'draw') {
      msg.textContent = '🤝 무승부!';
    } else {
      msg.textContent = `🎉 ${data[data.winner].name} 승리!`;
    }
    msg.className = 'msg-bar win';
    if (!resultShown) {
      resultShown = true;
      showResultModal();
    }
  } else {
    resultShown = false;
    $('result-modal').classList.remove('open');
    if (myTurn) {
      msg.textContent = selectedIdx >= 0 ? '이 자리에 놓을까요?' : '내 차례입니다. 돌을 놓으세요!';
    } else {
      const opp = data.turn === 'black' ? data.black.name : data.white.name;
      msg.textContent = `${opp}이(가) 생각 중...`;
    }
    msg.className = 'msg-bar';
  }
}

// ── 돌 선택 ───────────────────────────────────────────────────
function setSelected(idx) {
  selectedIdx = idx;
  drawBoard(state.board, -1);
  if (idx >= 0) drawSelection(idx);
  $('btn-place').style.display = idx >= 0 ? 'block' : 'none';
  $('btn-cancel-place').style.display = idx >= 0 ? 'block' : 'none';
}

canvas.addEventListener('click', handleTap);
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  handleTap({ clientX: t.clientX, clientY: t.clientY });
}, { passive: false });

function handleTap(e) {
  if (!state || !state.white || gameOver || waitingMove) return;
  if (state.turn !== myRole) { toast('상대방 차례입니다'); return; }

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;

  const col = Math.round((px - boardPad) / cellSize);
  const row = Math.round((py - boardPad) / cellSize);
  if (col < 0 || col >= BOARD || row < 0 || row >= BOARD) return;

  const idx = row * BOARD + col;
  if (state.board[idx] !== 0) { toast('이미 돌이 있습니다'); return; }

  setSelected(idx);
  $('msg-bar').textContent = '이 자리에 놓을까요?';
}

$('btn-place').addEventListener('click', () => {
  if (selectedIdx < 0 || !state) return;
  const idx = selectedIdx;
  selectedIdx = -1;
  hidePlaceButtons();
  if (myRole === 'black') {
    applyMove(idx, 'black');
  } else if (conn && conn.open) {
    waitingMove = true;
    conn.send({ type: 'move', idx });
  }
});

$('btn-cancel-place').addEventListener('click', () => {
  if (!state) return;
  selectedIdx = -1;
  drawBoard(state.board, state.lastMove ?? -1);
  hidePlaceButtons();
  $('msg-bar').textContent = '내 차례입니다. 돌을 놓으세요!';
});

// ── 승리 판정 ─────────────────────────────────────────────────
function checkWin(board, idx) {
  const color = board[idx];
  const row = Math.floor(idx / BOARD), col = idx % BOARD;
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let d = 1; d < 5; d++) {
      const r = row + dr * d, c = col + dc * d;
      if (r < 0 || r >= BOARD || c < 0 || c >= BOARD || board[r * BOARD + c] !== color) break;
      count++;
    }
    for (let d = 1; d < 5; d++) {
      const r = row - dr * d, c = col - dc * d;
      if (r < 0 || r >= BOARD || c < 0 || c >= BOARD || board[r * BOARD + c] !== color) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

// ── 결과 모달 ─────────────────────────────────────────────────
function showResultModal() {
  const w = state.winner;
  if (w === 'draw') {
    $('modal-title').textContent = '🤝 무승부';
    $('modal-msg').textContent = '승부가 나지 않았습니다.';
  } else {
    const iWon = w === myRole;
    $('modal-title').textContent = iWon ? '🎉 승리!' : '😢 패배';
    $('modal-msg').textContent = `${state[w].name}이(가) 이겼습니다!`;
  }
  $('result-modal').classList.add('open');
}

$('btn-play-again').addEventListener('click', () => {
  $('result-modal').classList.remove('open');
  if (!state) return;
  if (myRole === 'black') {
    if (state.white && state.winner) restartGame();
  } else if (conn && conn.open) {
    conn.send({ type: 'restart' });
  }
});

$('btn-lobby').addEventListener('click', goLobby);

// ── 나가기 ────────────────────────────────────────────────────
$('btn-leave').addEventListener('click', goLobby);
$('btn-leave-lobby').addEventListener('click', goLobby);

function goLobby() {
  clearTimeout(joinTimer);
  const c = conn, p = peer;
  conn = null;
  peer = null;
  try { c && c.close(); } catch (e) {}
  try { p && p.destroy(); } catch (e) {}
  state = null;
  myRole = null;
  roomCode = '';
  inRoom = false;
  gameOver = false;
  resultShown = false;
  waitingMove = false;
  selectedIdx = -1;
  setBusy(false);
  hidePlaceButtons();
  $('result-modal').classList.remove('open');
  show('lobby-screen');
}

// ── 코드 복사 ─────────────────────────────────────────────────
$('btn-copy-code').addEventListener('click', () => {
  navigator.clipboard.writeText(roomCode).then(() => toast('코드 복사됨!')).catch(() => {
    toast(roomCode);
  });
});

// ── 창 크기 변화 / 페이지 닫기 ────────────────────────────────
window.addEventListener('resize', () => {
  if (state && $('game-screen').classList.contains('active')) renderGame();
});
window.addEventListener('beforeunload', () => {
  try { peer && peer.destroy(); } catch (e) {}
});
})();
</script>
</body>
</html>
